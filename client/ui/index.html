<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Algomancy</title>
  <meta name="description" content="Draft and play Algomancy online, free in your browser: a rules-enforcing fan client for Caleb Gannon's card game. Send a friend a room code, or find a match.">
  <meta name="theme-color" content="#12151a">
  <!-- the icons and the preview image are built by site-icons.py from the game's own art -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- what a pasted link shows in Discord and elsewhere; og:image must be absolute -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Algomancy Online">
  <meta property="og:title" content="Algomancy — play online">
  <meta property="og:description" content="Draft and play Algomancy online, free in your browser. Send a friend a room code, or find a match.">
  <meta property="og:url" content="https://algomancy.online/">
  <meta property="og:image" content="https://algomancy.online/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script src="bundle.js"></script>
  <!-- rebuild with: npm --prefix ui run build   (append ?demo for a scripted mid-battle) -->
</body>
</html>
