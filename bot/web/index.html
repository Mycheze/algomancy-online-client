<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algomancy Rules Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🃏</text></svg>">
<!-- Markdown rendering + HTML sanitising (both small, CDN). The app already
     needs the internet to reach DeepSeek, so a CDN dependency is acceptable. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<!-- The puzzle board: the same CSS + renderer the editor previews with, so a
     puzzle looks identical while you're building it and while you're solving it. -->
<link rel="stylesheet" href="/static/board.css">
<style>
  :root {
    --bg: #14161c; --panel: #1c1f29; --panel-2: #232735; --line: #2f3445;
    --text: #e7e9f0; --muted: #9aa0b4; --accent: #7c89ff; --accent-2: #5865F2;
    --good: #3ba55d; --weird: #c9a227; --bad: #d83c3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Pinned to the (visual) viewport: header stays at top, the input footer stays
     just above the on-screen keyboard. JS keeps height = visualViewport.height. */
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    position: fixed; left: 0; right: 0; top: 0; height: 100dvh;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  .brand { display: flex; flex-direction: column; line-height: 1.18; min-width: 0; overflow: hidden; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  .iconbtn {
    margin-left: auto; flex: none; display: inline-flex; align-items: center;
    justify-content: center; width: 38px; height: 38px; border-radius: 9px;
    background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--accent); }
  .iconbtn svg { width: 20px; height: 20px; }

  #log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin: 0 0 18px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .02em; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  .msg.user .bubble { background: var(--panel-2); }
  .bubble :first-child { margin-top: 0; } .bubble :last-child { margin-bottom: 0; }
  .bubble code { background: #0c0e14; padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  .bubble pre { background: #0c0e14; padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .bubble a { color: var(--accent); }
  sup { color: var(--accent); font-weight: 700; }

  .hidden { display: none !important; }

  /* hover/tap card-name previews */
  .cardlink { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; }
  .cardlink:hover { text-decoration-style: solid; }
  #cardtip { position: fixed; z-index: 50; }
  #cardtip img {
    display: block; width: 240px; max-width: 82vw; height: auto;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    box-shadow: 0 10px 34px rgba(0,0,0,.62); cursor: zoom-in;
  }

  /* image modal (lightbox) */
  #modal {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #modal img {
    max-width: min(96vw, 560px); max-height: 92vh; border-radius: 12px;
    border: 1px solid var(--line); box-shadow: 0 12px 46px rgba(0,0,0,.7);
  }
  #modal .close {
    position: absolute; top: 10px; right: 16px; background: transparent; border: none;
    color: #fff; font-size: 36px; line-height: 1; cursor: pointer; opacity: .85;
  }
  #modal .close:hover { opacity: 1; }

  .sources { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .sources b { color: var(--text); }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .cards img {
    height: 132px; border-radius: 8px; border: 1px solid var(--line);
    transition: transform .12s; background: var(--panel-2); cursor: zoom-in;
  }
  .cards img:hover { transform: scale(1.04); border-color: var(--accent); }
  .cards .cap { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }

  .meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .meta .model { font-size: 12px; color: var(--muted); }
  .fb { display: flex; gap: 6px; }
  .fb button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 13px;
  }
  .fb button:hover { border-color: var(--accent); }
  .fb button.good.on { background: var(--good); border-color: var(--good); }
  .fb button.weird.on { background: var(--weird); border-color: var(--weird); color: #1a1a1a; }
  .fb button.bad.on { background: var(--bad); border-color: var(--bad); }
  .fb.done button:not(.on) { opacity: .4; }
  .fb .thanks { font-size: 12px; color: var(--muted); align-self: center; }
  .followbtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 13px;
  }
  .followbtn:hover { color: var(--text); border-color: var(--accent); }
  /* threaded (follow-up) messages get an accent rail so the chain reads as one */
  .msg.follow { border-left: 2px solid var(--accent); padding-left: 12px; }

  /* inline game icons (augment, factions, mana, …) */
  .icon { height: 1.05em; width: auto; vertical-align: -0.18em; margin: 0 1px; }

  /* card lookup panel — image + core info on top, rulings full-width below */
  .card-panel { display: flex; flex-direction: column; gap: 12px; }
  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .card-panel img.art { height: 210px; flex: none; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
  .card-panel .info { flex: 1; min-width: 0; }
  .card-panel .cardtext { margin-top: 6px; line-height: 1.5; }
  .card-panel .info h3 { margin: 0 0 4px; }
  .card-panel .info .tl { color: var(--muted); font-style: italic; margin-bottom: 8px; }
  .card-panel .info .row { font-size: 14px; margin-bottom: 4px; }
  /* A stacked (grafted/augmented) card is taller than one card, so give it more
     room than a plain card's thumbnail or it shrinks to a sliver. */
  .card-panel img.art.stack { height: 300px; }
  .card-panel .mod { margin-top: 6px; color: var(--muted); }
  .card-panel .rul { font-size: 13px; color: var(--muted); }
  .card-panel .rul ul { margin: 4px 0 0; padding-left: 18px; }
  .card-panel .rul li { margin-bottom: 4px; }

  /* card search (/search) — the best match renders as a normal card panel above,
     and these are the runners-up you can tap to swap it out. */
  .search-panel .smore { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .search-panel .shead { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .sresult {
    display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
    padding: 7px 8px; margin-bottom: 5px; border-radius: 9px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font: inherit; transition: border-color .12s;
  }
  .sresult:hover, .sresult.on { border-color: var(--accent); }
  /* Direct child only: the row's text also holds inline <img class="icon"> game
     icons, and they must not pick up the thumbnail's box. */
  .sresult > img, .sresult > .noart {
    width: 40px; height: 40px; flex: none; border-radius: 6px; object-fit: cover;
    object-position: center 22%;            /* card art sits above the text box */
    background: var(--panel);
  }
  .sresult .body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .sresult .nm { font-weight: 600; font-size: 14px; }
  .sresult .nm .pt { color: var(--muted); font-weight: 400; }
  .sresult .tl { color: var(--muted); font-size: 12px; font-style: italic; }
  .sresult .sn {
    color: var(--muted); font-size: 12.5px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sresult .icon { height: 13px; vertical-align: -2px; }
  .shint { color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* colour-combo suggestion panel (/colors) */
  .combo-panel .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .combo-panel h3 { margin: 0; font-size: 17px; }
  .combo { display: flex; gap: 6px; flex-wrap: wrap; }
  /* NB: not `.chip` — the greeting suggestions already own that class. */
  .cchip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2);
    font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .cchip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cchip img { height: 1.15em; width: auto; }
  .combo-panel .why { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .combo-panel .bar {
    display: flex; align-items: center; gap: 9px; margin-top: 10px;
    font-size: 13px; color: var(--muted);
  }
  .combo-panel .track {
    flex: 1; height: 7px; border-radius: 99px; background: var(--panel-2);
    border: 1px solid var(--line); overflow: hidden; min-width: 90px;
  }
  .combo-panel .fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .combo-panel .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .combo-panel .acts button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px;
  }
  .combo-panel .acts button:hover:not(:disabled) { border-color: var(--accent); }
  .combo-panel .acts button.play.on { background: var(--good); border-color: var(--good); }
  .combo-panel .acts button:disabled { opacity: .45; cursor: default; }
  .combo-panel .note { font-size: 13px; color: var(--muted); align-self: center; }
  .combo-list { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .combo-list b { color: var(--text); }
  .combo-list ul { margin: 5px 0 0; padding-left: 18px; columns: 2; }
  @media (max-width: 520px) { .combo-list ul { columns: 1; } }
  .combo-list li { margin-bottom: 2px; break-inside: avoid; }

  /* pack-1-pick-X draft (/p1p1, /p1p6) */
  .draft-panel h3 { margin: 0; font-size: 17px; }
  .draft-panel .why { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .draft-panel .why b { color: var(--text); }
  .dbar { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
  .dbar .count { font-weight: 700; color: var(--text); }
  .dbar .count.full { color: var(--good); }
  .dbar .dnote { color: var(--muted); }
  .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 12px; }
  .draft-card {
    position: relative; aspect-ratio: 720 / 1000; border-radius: 8px; overflow: hidden;
    border: 2px solid var(--line); background: var(--panel-2); cursor: pointer; user-select: none;
  }
  .draft-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .draft-card .noart { padding: 6px; font-size: 11px; color: var(--muted); }
  .draft-card .num {
    position: absolute; top: 4px; left: 4px; min-width: 20px; height: 20px; padding: 0 4px;
    border-radius: 10px; background: rgba(0,0,0,.74); color: #fff; font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.5);
  }
  .draft-card .dzoom {
    position: absolute; bottom: 4px; right: 4px; width: 22px; height: 22px; border-radius: 6px;
    background: rgba(0,0,0,.66); color: #fff; border: none; cursor: zoom-in; font-size: 12px;
    opacity: 0; transition: opacity .12s; display: flex; align-items: center; justify-content: center;
  }
  .draft-card:hover .dzoom { opacity: 1; }
  @media (hover: none) { .draft-card .dzoom { opacity: 1; } }
  .draft-card .check {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-2); color: #fff; font-size: 13px; font-weight: 700; display: none;
    align-items: center; justify-content: center; box-shadow: 0 1px 6px rgba(0,0,0,.5);
  }
  .draft-card.pick { border-color: var(--accent); }
  .draft-card.pick .check { display: inline-flex; }
  .draft-card.dimmed img { filter: brightness(.4); }
  .dacts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .dacts button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px;
  }
  .dacts button:hover { border-color: var(--accent); }
  .dhint { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .dhint code { font-size: .92em; }

  .dots span { animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px env(safe-area-inset-bottom); }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: inherit; max-height: 160px; overflow-y: hidden;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    background: var(--accent-2); color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 15px;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  .err { color: var(--bad); }

  /* follow-up banner above the input */
  #followbar {
    max-width: 820px; margin: 0 auto 8px; display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 9px;
    padding: 6px 10px; font-size: 13px;
  }
  #followbar .fb-label { color: var(--accent); white-space: nowrap; }
  #followbar #followq { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #followbar #followx { flex: none; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  #followbar #followx:hover { color: var(--text); }

  /* rotating greeting suggestions */
  .suggest { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .chip {
    max-width: 100%; text-align: left; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px; cursor: pointer;
    font: inherit; font-size: 13.5px; line-height: 1.35; white-space: normal;
  }
  .chip:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>🃏 Algomancy Rules Bot</h1>
    <span class="sub">unofficial · ask any rules question</span>
  </div>
  <button class="iconbtn" id="reset" type="button" aria-label="New chat" title="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <div id="followbar" class="hidden">
    <span class="fb-label">↪ Following up on:</span>
    <span id="followq"></span>
    <button id="followx" type="button" aria-label="Cancel follow-up" title="Back to a fresh question">✕</button>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a rules question…" autofocus></textarea>
    <button class="send" id="send" type="submit">Ask</button>
  </form>
  <div class="hint">Answers come from the official rules corpus + card data. Rate answers to help improve the bot. Not affiliated with the game's creator.</div>
</footer>

<!-- floating card-name preview + image lightbox -->
<div id="cardtip" class="hidden"><img alt="card preview"></div>
<div id="modal" class="hidden"><button class="close" aria-label="Close">&times;</button><img alt="card art"></div>

<!-- The puzzle-board renderer, shared with the editor (see board.js). -->
<script src="/static/board.js"></script>
<script>
  // Hold the middle mouse button over a card to read it full-size, anywhere on the
  // page. Clicking still opens the lightbox — this is the no-commitment version,
  // for when you just want to check what a unit does mid-puzzle.
  WtpBoard.holdZoom(document);
</script>
<script>
const wrap = document.getElementById('wrap');
const logEl = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const followbar = document.getElementById('followbar');
const followQ = document.getElementById('followq');

// Stable per-browser id so feedback/logs can be grouped without accounts.
const sessionId = (() => {
  let s = localStorage.getItem('algo_sid');
  if (!s) { s = 'web-' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('algo_sid', s); }
  return s;
})();

// Follow-up context. null = each question is independent (no history sent — like
// Discord's &ask). It's set to a turn-chain only when the user clicks "Follow up"
// on an answer, which threads the next question(s) onto that answer's context.
let replyCtx = null;

// Rotating greeting suggestions: random past question + random card to look up.
let CARD_LIST = [];
let EXAMPLES = [
  "Does spawning a Robot with +1/+1 counters trigger Scrapyard Custodian?",
  "What happens to a buffed unit's combat damage at regroup?",
  "Can a Flying unit be blocked by a non-Flying unit?",
  "How does Piercing excess damage work?",
  "What's the difference between bounded and unbounded graft?",
];
let curQ = '', curCard = '';
const rand = a => a[Math.floor(Math.random() * a.length)];

marked.setOptions({ breaks: true });
function md(text) { return DOMPurify.sanitize(marked.parse(text || '')); }
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function scroll() { logEl.scrollTop = logEl.scrollHeight; }

function addUser(text, isFollow) {
  const el = document.createElement('div');
  el.className = 'msg user' + (isFollow ? ' follow' : '');
  el.innerHTML = `<div class="who">${isFollow ? '↪ Follow-up' : 'You'}</div><div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  wrap.appendChild(el); scroll();
}

function addBot() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `<div class="who">Rules Bot</div><div class="bubble"><span class="dots"><span>●</span><span>●</span><span>●</span></span></div>`;
  wrap.appendChild(el); scroll();
  return el;
}

function sourcesHtml(sources) {
  if (!sources || !sources.length) return '';
  const items = sources.map(s => `<div><b>${s.n}.</b> ${esc(s.name)} · <i>${esc(s.authority)}</i></div>`).join('');
  return `<div class="sources"><div style="margin-bottom:3px"><b>Sources</b></div>${items}</div>`;
}

function cardsHtml(cards) {
  if (!cards || !cards.length) return '';
  const items = cards.filter(c => c.art_url).map(c =>
    `<div><img src="${c.art_url}" data-full="${c.art_url}" alt="${esc(c.title)}" loading="lazy"><div class="cap">${c.n}. ${esc(c.title)}</div></div>`
  ).join('');
  return items ? `<div class="cards">${items}</div>` : '';
}

function feedbackHtml(rid, model, reasoning) {
  const badge = reasoning ? ' · 🧠 thinking' : '';
  return `<div class="meta">
    <div class="fb" data-rid="${rid}">
      <button class="good" data-r="good" title="Helpful">👍</button>
      <button class="weird" data-r="weird" title="Correct but oddly written">🤔</button>
      <button class="bad" data-r="bad" title="Inaccurate">👎</button>
    </div>
    <button class="followbtn" type="button" title="Ask a question that builds on this answer">↪ Follow up</button>
    <span class="model">${esc(model || '')}${badge}</span>
  </div>`;
}

function wireFeedback(scope) {
  const fb = scope.querySelector('.fb');
  if (!fb) return;
  fb.querySelectorAll('button').forEach(btn => btn.addEventListener('click', async () => {
    if (fb.classList.contains('done')) return;
    const rating = btn.dataset.r;
    btn.classList.add('on'); fb.classList.add('done');
    fb.insertAdjacentHTML('beforeend', '<span class="thanks">thanks!</span>');
    try {
      await fetch('/api/feedback', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ response_id: fb.dataset.rid, rating, session_id: sessionId }) });
    } catch (e) { /* logging is best-effort */ }
  }));
}

// `ctx` is the prior turn-chain to send (empty = a fresh, context-free question).
async function ask(question, ctx) {
  ctx = ctx || [];
  const isFollow = ctx.length > 0;
  addUser(question, isFollow);
  const botEl = addBot();
  if (isFollow) botEl.classList.add('follow');
  const bubble = botEl.querySelector('.bubble');
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ question, history: ctx, session_id: sessionId }) });
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail || res.statusText;
      bubble.innerHTML = `<span class="err">⚠️ ${esc(detail)}</span>`; scroll(); return;
    }
    const data = await res.json();
    // data.answer is plain markdown with the icon tokens still in it — renderIcons
    // swaps them for <img> below, on the DOM. It's also what we send back as
    // history, so no markup leaks into the model.
    bubble.innerHTML = md(data.answer)
                     + sourcesHtml(data.sources) + cardsHtml(data.cited_cards)
                     + feedbackHtml(data.response_id, data.model, data.reasoning);
    wireFeedback(botEl);
    renderIcons(botEl);
    linkifyCards(botEl);
    // The context to send if someone follows up on THIS answer: prior chain + this turn.
    const nextCtx = [...ctx, { role: 'user', content: question }, { role: 'assistant', content: data.answer }];
    const fbtn = botEl.querySelector('.followbtn');
    if (fbtn) fbtn.addEventListener('click', () => enterFollowup(nextCtx, question));
    // Keep an open thread going; a fresh question stays fresh (default = no context).
    if (isFollow) enterFollowup(nextCtx, question); else exitFollowup();
  } catch (e) {
    bubble.innerHTML = `<span class="err">⚠️ Network error — is the server running?</span>`;
  } finally {
    sendBtn.disabled = false; scroll();
  }
}

// Enter follow-up mode: the next question threads onto `ctx`. `label` is the
// question being followed up, shown in the banner above the input.
function enterFollowup(ctx, label) {
  replyCtx = ctx;
  followQ.textContent = label;
  followbar.classList.remove('hidden');
  input.placeholder = 'Ask a follow-up…';
  input.focus();
}
function exitFollowup() {
  replyCtx = null;
  followbar.classList.add('hidden');
  input.placeholder = 'Ask a rules question…';
}

// The full card display, shared by `/card` and by whichever result you land on
// from `/search` — finding a card by describing it should end in exactly the same
// place as knowing its name did.
function cardPanelHtml(c) {
  const pt = (c.power !== '' || c.toughness !== '') ? `${esc(c.power)}/${esc(c.toughness)}` : '';
  const costHtml = (c.cost_html || '—') + (c.total_cost ? ` (total ${esc(c.total_cost)})` : '');
  const rulings = (c.rulings || []).length
    ? `<div class="rul"><b>Rulings</b><ul>${c.rulings.map(r => '<li>'+esc(r)+'</li>').join('')}</ul></div>` : '';
  const alts = (c.alts || []).length ? `<div class="rul">Did you mean: ${c.alts.map(esc).join(', ')}</div>` : '';
  return `<div class="card-panel">
    <div class="card-head">
      ${c.art_url ? `<img class="art${c.mod_html ? ' stack' : ''}" src="${c.art_url}" data-full="${c.art_url}" alt="${esc(c.name)}">` : ''}
      <div class="info">
        <h3>${esc(c.name)}</h3>
        <div class="tl">${c.type_html || ''}</div>
        <div class="row"><b>Cost:</b> ${costHtml}</div>
        ${pt ? `<div class="row"><b>P/T:</b> ${pt}</div>` : ''}
        <div class="row"><b>Factions:</b> ${c.factions_html || '—'}</div>
        ${c.text_html ? `<div class="row cardtext">${c.text_html}</div>` : ''}
        ${c.mod_html ? `<div class="row mod"><b>Modification:</b> ${c.mod_html}</div>` : ''}
      </div>
    </div>
    ${rulings}${alts}</div>`;
}

// Fetch a card by name and render it into `host`. Returns false if it's gone.
async function renderCardInto(host, name) {
  const res = await fetch('/api/card?name=' + encodeURIComponent(name));
  if (!res.ok) {
    const detail = (await res.json().catch(() => ({}))).detail || 'not found';
    host.innerHTML = `<span class="err">${esc(detail)}</span>`;
    return false;
  }
  host.innerHTML = DOMPurify.sanitize(cardPanelHtml(await res.json()));
  return true;
}

async function lookupCard(name) {
  addUser('/card ' + name);
  const botEl = addBot();
  const bubble = botEl.querySelector('.bubble');
  try {
    await renderCardInto(bubble, name);
    linkifyCards(botEl);
  } catch (e) {
    bubble.innerHTML = `<span class="err">⚠️ Network error.</span>`;
  } finally { scroll(); }
}

// ---- card search (/search) ----
// `/card` needs the name; this needs only a memory of what the card did. The
// ranking is server-side (cards.CardIndex.search, same as the bot's `&search`);
// the page shows the best match in full and keeps the runners-up one tap away,
// because a description is a guess and the second guess is often the right one.

function searchRowHtml(r, active) {
  const pt = (r.power !== '' || r.toughness !== '') ? `${esc(r.power)}/${esc(r.toughness)}` : '';
  return `<button class="sresult${active ? ' on' : ''}" type="button" data-name="${esc(r.name)}">
    ${r.art_url ? `<img src="${esc(r.art_url)}" alt="" loading="lazy">` : '<span class="noart"></span>'}
    <span class="body">
      <span class="nm">${esc(r.name)}${pt ? ` <span class="pt">${pt}</span>` : ''}</span>
      <span class="tl">${r.type_html || ''}</span>
      <span class="sn">${r.snippet_html || ''}</span>
    </span></button>`;
}

async function searchCards(query) {
  addUser('/search ' + query);
  const botEl = addBot();
  const bubble = botEl.querySelector('.bubble');
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(query));
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail || 'search failed';
      bubble.innerHTML = `<span class="err">${esc(detail)}</span>`; return;
    }
    const d = await res.json();
    const results = d.results || [];
    if (!results.length) {
      bubble.innerHTML = `<span class="err">Nothing matched <b>${esc(query)}</b>.</span>
        <div class="shint">Try describing what the card <i>does</i> — “deals damage to every unit”,
        “recall a unit from the bin”, “2/1 with haste” — or look it up by name with <code>/card</code>.</div>`;
      return;
    }
    // Every result gets a row, including the one shown above — otherwise tapping a
    // runner-up would strand you, with no way back to the best match short of
    // retyping the search. The shown one is just the active row.
    bubble.innerHTML = DOMPurify.sanitize(
      `<div class="search-panel">
        <div class="shost"></div>
        ${results.length > 1 ? `<div class="smore">
          <div class="shead">Not the one? ${results.length} matches — tap to compare</div>
          ${results.map((r, i) => searchRowHtml(r, i === 0)).join('')}
        </div>` : ''}
      </div>`);

    const host = bubble.querySelector('.shost');
    await renderCardInto(host, results[0].name);
    linkifyCards(botEl);

    // Tapping another match swaps the card shown above, in place — the list stays
    // put so you can keep trying candidates without re-running the search.
    bubble.querySelectorAll('.sresult').forEach(btn => {
      btn.addEventListener('click', async () => {
        bubble.querySelectorAll('.sresult').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        await renderCardInto(host, btn.dataset.name);
        linkifyCards(botEl);
        host.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    });
  } catch (e) {
    bubble.innerHTML = `<span class="err">⚠️ Network error.</span>`;
  } finally { scroll(); }
}

// ---- colour-combo suggestions (/colors) ----
// Which 3-colour decks this browser has played, so we can suggest fresh ones.
// Keyed on `sessionId`, same as feedback — no account needed. Nothing is recorded
// until "We played this" is clicked, so re-rolling never pollutes the history.

const titleCase = s => s.charAt(0).toUpperCase() + s.slice(1);
const comboLabel = colors => colors.map(titleCase).join(' · ');

function comboChips(colors, d) {
  return colors.map(c => {
    const icon = (d.icons || {})[c];
    const sw = (d.swatches || {})[c] || '';
    // Only ever inline a swatch we've verified is a plain hex colour.
    const dot = /^#[0-9a-f]{6}$/i.test(sw) ? sw : '#8a8f9e';
    const badge = icon ? `<img src="${esc(icon)}" alt="">`
                       : `<span class="dot" style="background:${dot}"></span>`;
    return `<span class="cchip">${badge}${esc(titleCase(c))}</span>`;
  }).join('');
}

function progressHtml(done, total) {
  const pct = total ? Math.round(100 * done / total) : 0;
  return `<div class="bar"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span>${done}/${total} explored</span></div>`;
}

function comboListHtml(title, items, render) {
  if (!items.length) return '';
  return `<div class="combo-list"><b>${esc(title)} (${items.length})</b>
    <ul>${items.map(render).join('')}</ul></div>`;
}

function comboPanelHtml(d) {
  const why = d.reason === 'new'
    ? "You've <b>never played this one</b>."
    : "You've played every combo — this is the one you've gone longest without.";
  const rest = comboListHtml('Never played', d.unplayed || [],
    c => `<li>${esc(comboLabel(c))}</li>`);
  return `<div class="combo-panel" data-key="${esc(d.suggestion.join('-'))}">
    <div class="head"><h3>🎲 Play</h3><div class="combo">${comboChips(d.suggestion, d)}</div></div>
    <p class="why">${why}</p>
    ${progressHtml(d.played_count, d.total)}
    <div class="acts">
      <button class="play" type="button">✅ We played this</button>
      <button class="roll" type="button">🎲 Re-roll</button>
    </div>${rest}</div>`;
}

function comboStatsHtml(d, note) {
  const played = comboListHtml('Played', d.played || [],
    p => `<li>${esc(comboLabel(p.colors))} — ${p.count}×, last ${esc((p.last || '').slice(0, 10))}</li>`);
  const rest = comboListHtml('Never played', d.unplayed || [],
    c => `<li>${esc(comboLabel(c))}</li>`);
  const empty = (d.played || []).length ? ''
    : `<p class="why">Nothing recorded yet — type <code>/colors</code> for a suggestion.</p>`;
  const done = !(d.unplayed || []).length
    ? `<p class="why">You've played every combo — the full set. 🎉</p>` : '';
  return `<div class="combo-panel">
    <div class="head"><h3>🎨 Your colour history</h3></div>
    ${note ? `<p class="why">${esc(note)}</p>` : ''}
    ${progressHtml(d.played_count, d.total)}${empty}${done}${played}${rest}</div>`;
}

function renderCombo(bubble, d) {
  bubble.innerHTML = DOMPurify.sanitize(comboPanelHtml(d));
  const panel = bubble.querySelector('.combo-panel');
  const play = panel.querySelector('.play'), roll = panel.querySelector('.roll');
  const colors = panel.dataset.key.split('-');

  play.addEventListener('click', async () => {
    play.disabled = roll.disabled = true;
    try {
      const res = await fetch('/api/colors/played', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ colors, session_id: sessionId }) });
      if (!res.ok) throw new Error('rejected');
      const r = await res.json();
      play.classList.add('on');
      // Update the progress in place; the "never played" list is now stale.
      panel.querySelector('.fill').style.width =
        (r.total ? Math.round(100 * r.played_count / r.total) : 0) + '%';
      panel.querySelector('.bar span').textContent = `${r.played_count}/${r.total} explored`;
      const stale = panel.querySelector('.combo-list');
      if (stale) stale.remove();
      const msg = r.recorded ? 'Recorded — have a good game!' : 'Already recorded today.';
      panel.querySelector('.acts').insertAdjacentHTML('beforeend',
        `<span class="note">${esc(msg)}</span>`);
    } catch (e) {
      play.disabled = roll.disabled = false;
      panel.querySelector('.acts').insertAdjacentHTML('beforeend',
        '<span class="note">⚠️ Couldn\'t record that.</span>');
    } finally { scroll(); }
  });

  roll.addEventListener('click', async () => {
    roll.disabled = play.disabled = true;
    try {
      const res = await fetch('/api/colors?session_id=' + encodeURIComponent(sessionId)
        + '&exclude=' + encodeURIComponent(panel.dataset.key));
      if (!res.ok) throw new Error('rejected');
      renderCombo(bubble, await res.json());     // fresh panel, freshly wired
    } catch (e) {
      roll.disabled = play.disabled = false;
    } finally { scroll(); }
  });
}

const STATS_WORDS = /^(stats|history|list|coverage)$/i;

async function showColors(arg) {
  arg = (arg || '').trim();
  addUser('/colors' + (arg ? ' ' + arg : ''));
  const botEl = addBot();
  const bubble = botEl.querySelector('.bubble');
  try {
    if (arg && !STATS_WORDS.test(arg)) {
      // "/colors fire earth wood" — record it directly, then show the history.
      const colors = arg.split(/[^a-z]+/i).filter(Boolean);
      const res = await fetch('/api/colors/played', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ colors, session_id: sessionId }) });
      const r = await res.json();
      if (!res.ok) { bubble.innerHTML = `<span class="err">⚠️ ${esc(r.detail || 'Bad colours.')}</span>`; return; }
      const note = r.recorded ? `✅ Recorded ${comboLabel(r.colors)}.` : 'Already recorded today.';
      bubble.innerHTML = DOMPurify.sanitize(comboStatsHtml(r, note));
      return;
    }
    const res = await fetch('/api/colors?session_id=' + encodeURIComponent(sessionId));
    if (!res.ok) { bubble.innerHTML = `<span class="err">⚠️ Couldn't load your colours.</span>`; return; }
    const d = await res.json();
    if (STATS_WORDS.test(arg)) bubble.innerHTML = DOMPurify.sanitize(comboStatsHtml(d));
    else renderCombo(bubble, d);
  } catch (e) {
    bubble.innerHTML = `<span class="err">⚠️ Network error.</span>`;
  } finally { scroll(); }
}

// ---- pack-1-pick-X draft (/p1p1, /p1p6) ----
// A reproducible pack rendered as a tap-to-pick grid. Picking is entirely client-
// side — no server round trip — and the pack's `code` is the shareable seed (the
// same string replays the exact pack in the Discord bot). Card art has no
// `data-full`, so a tap toggles the pick; the corner 🔍 button opens the lightbox.

function draftUrl(code) {
  return location.origin + location.pathname + '?draft=' + encodeURIComponent(code);
}

function flashBtn(btn, msg) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old; btn.textContent = msg;
  setTimeout(() => { btn.textContent = btn.dataset.label; }, 1400);
}

// Copy that also works over plain http (LAN), where navigator.clipboard is absent.
function copyText(text, btn) {
  const done = ok => flashBtn(btn, ok ? '✓ Copied' : 'Copy failed');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => done(true), fallback);
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done(ok);
  }
}

function draftPanelHtml(d) {
  const cards = (d.slots || []).map(s => `
    <div class="draft-card" data-slot="${s.slot}" title="${esc(s.name)}">
      ${s.art_url
        ? `<img src="${esc(s.art_url)}" alt="${esc(s.name)}" loading="lazy">`
        : `<div class="noart">${esc(s.name)}</div>`}
      <span class="num">${s.slot}</span>
      ${s.art_url ? `<button class="dzoom" type="button" title="Zoom"
          data-full="${esc(s.art_url)}" data-name="${esc(s.name)}">🔍</button>` : ''}
      <span class="check">✓</span>
    </div>`).join('');
  const elems = (d.elements || []).map(titleCase).join(' · ');
  return `<div class="draft-panel" data-code="${esc(d.code)}" data-picks="${d.picks}">
    <div class="head"><h3>🃏 ${esc(d.label)}</h3></div>
    <p class="why">${esc(d.blurb)}${elems ? ' · <b>' + esc(elems) + '</b>' : ''}</p>
    <div class="dbar"><span class="count">0/${d.picks} picked</span><span class="dnote"></span></div>
    <div class="draft-grid">${cards}</div>
    <div class="dacts">
      <button class="dcopy" type="button">🔗 Copy link</button>
      <button class="dseed" type="button">🎲 Copy seed</button>
      <button class="dnew" type="button">↻ New pack</button>
    </div>
    <div class="dhint">Tap cards to keep your ${d.picks}. Seed <code>${esc(d.code)}</code> —
      same pack in the bot: <code>&${esc(d.mode)} ${esc(d.seed)}</code></div>
  </div>`;
}

function renderDraft(bubble, d) {
  bubble.innerHTML = DOMPurify.sanitize(draftPanelHtml(d));
  const panel = bubble.querySelector('.draft-panel');
  const cap = d.picks;
  const cards = [...panel.querySelectorAll('.draft-card')];
  const count = panel.querySelector('.count');
  const note = panel.querySelector('.dnote');
  const picks = new Set();

  function refresh() {
    const atCap = picks.size === cap;
    count.textContent = `${picks.size}/${cap} picked`;
    count.classList.toggle('full', atCap);
    cards.forEach(c => {
      const on = picks.has(+c.dataset.slot);
      c.classList.toggle('pick', on);
      c.classList.toggle('dimmed', atCap && !on);   // spotlight the chosen set
    });
    note.textContent = atCap ? (cap === 1 ? "That's your pick." : `That's your ${cap}.`) : '';
  }

  cards.forEach(card => card.addEventListener('click', () => {
    const slot = +card.dataset.slot;
    if (picks.has(slot)) picks.delete(slot);
    else if (picks.size >= cap) {
      note.textContent = `You can only keep ${cap} — tap a pick to swap it out.`;
      return;
    } else picks.add(slot);
    refresh();
  }));
  // The corner zoom opens the lightbox without counting as a pick.
  panel.querySelectorAll('.dzoom').forEach(z => z.addEventListener('click', e => {
    e.stopPropagation();
    openModal(z.dataset.full, z.dataset.name);
  }));

  panel.querySelector('.dcopy').addEventListener('click', e => copyText(draftUrl(d.code), e.currentTarget));
  panel.querySelector('.dseed').addEventListener('click', e => copyText(d.code, e.currentTarget));
  panel.querySelector('.dnew').addEventListener('click', () => showDraft(d.mode, ''));
  refresh();
}

async function showDraft(mode, arg) {
  arg = (arg || '').trim();
  addUser('/' + mode + (arg ? ' ' + arg : ''));
  const botEl = addBot();
  const bubble = botEl.querySelector('.bubble');
  try {
    const url = '/api/draft?mode=' + encodeURIComponent(mode)
      + (arg ? '&seed=' + encodeURIComponent(arg) : '');
    const res = await fetch(url);
    const d = await res.json();
    if (!res.ok) { bubble.innerHTML = `<span class="err">⚠️ ${esc(d.detail || 'Bad draft.')}</span>`; return; }
    renderDraft(bubble, d);
    // Reflect the pack in the address bar so a refresh or copied URL reproduces it.
    history.replaceState(null, '', draftUrl(d.code));
  } catch (e) {
    bubble.innerHTML = `<span class="err">⚠️ Network error.</span>`;
  } finally { scroll(); }
}

// ---- "What's the play?" puzzles ----
// A board, a question, a box to write your answer in, and a reveal. You answer
// first and reveal second on purpose: the solution is fetched from its own
// endpoint only when you ask for it, so it's never sitting in the page while
// you're supposed to be thinking about it.

function wtpUrl(id) {
  return location.origin + location.pathname + '?wtp=' + encodeURIComponent(id);
}

function wtpPanelHtml(p) {
  const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const hints = p.hint_count
    ? `<button class="whint" type="button">💡 Hint (1/${p.hint_count})</button>` : '';
  return `<div class="wtp" data-id="${esc(p.id)}" data-hints="${p.hint_count || 0}">
    <div class="wtp-head">
      <div class="meta">
        <h3>🧩 ${esc(p.title)}</h3>
        <span class="tag ${esc(p.difficulty)}">${esc(p.difficulty)}</span>
        ${tags}${p.author ? `<span class="tag">by ${esc(p.author)}</span>` : ''}
      </div>
      <p class="q">${esc(p.question)}</p>
    </div>
    <div class="wboard"></div>
    ${p.notes ? `<p class="notes">${esc(p.notes)}</p>` : ''}
    <textarea class="answer" placeholder="Work it out — what's the play, and why? (Writing it down is the practice.)"></textarea>
    <div class="hintbox"></div>
    <div class="wacts">
      <button class="wreveal primary" type="button">🔑 Reveal the answer</button>
      ${hints}
      <button class="wtotals" type="button" title="Show each column's combined power">🧮 Column totals</button>
      <button class="wnext" type="button">➡️ Another puzzle</button>
      <button class="wlink" type="button">🔗 Copy link</button>
    </div>
    <div class="solbox"></div>
  </div>`;
}

async function renderWtp(bubble, p) {
  bubble.innerHTML = DOMPurify.sanitize(wtpPanelHtml(p));
  const panel = bubble.querySelector('.wtp');
  // The board is rendered by the shared renderer, not by sanitized markup: it
  // wires its own click handlers (zoom), which DOMPurify would strip.
  const board = WtpBoard.render(panel.querySelector('.wboard'), p,
    { icons: p.icons || {}, onZoom: openModal });

  const answer = panel.querySelector('.answer');
  let hintsShown = 0;

  panel.querySelector('.wtotals').addEventListener('click', () => {
    board.classList.toggle('totals');
  });
  panel.querySelector('.wnext').addEventListener('click', () => showWtp('', p.id));
  panel.querySelector('.wlink').addEventListener('click',
    e => copyText(wtpUrl(p.id), e.currentTarget));

  const hintBtn = panel.querySelector('.whint');
  if (hintBtn) hintBtn.addEventListener('click', async () => {
    const d = await fetch(`/api/wtp/${encodeURIComponent(p.id)}/solution?session_id=`
      + encodeURIComponent(sessionId) + '&hint=1').then(r => r.json());
    const hints = d.hints || [];
    if (hintsShown >= hints.length) return;
    const box = panel.querySelector('.hintbox');
    box.insertAdjacentHTML('beforeend',
      `<div class="wtp-hint">💡 ${esc(hints[hintsShown])}</div>`);
    hintsShown++;
    hintBtn.textContent = hintsShown >= hints.length
      ? '💡 No more hints' : `💡 Hint (${hintsShown + 1}/${hints.length})`;
    hintBtn.disabled = hintsShown >= hints.length;
    scroll();
  });

  panel.querySelector('.wreveal').addEventListener('click', async e => {
    const btn = e.currentTarget;
    btn.disabled = true;
    // Save what they wrote BEFORE showing them the answer — afterwards it isn't
    // their answer any more, and what they actually thought is the useful record.
    const written = answer.value.trim();
    if (written) {
      fetch('/api/wtp/attempt', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ puzzle_id: p.id, answer: written, session_id: sessionId }),
      }).catch(() => {});
    }
    try {
      const res = await fetch(`/api/wtp/${encodeURIComponent(p.id)}/solution?session_id=`
        + encodeURIComponent(sessionId));
      const d = await res.json();
      if (!res.ok) throw new Error(d.detail || 'no solution');
      const box = panel.querySelector('.solbox');
      box.innerHTML = `<div class="solution"><h4>THE ANSWER</h4>${
        DOMPurify.sanitize(marked.parse(d.solution || '_No solution was written for this one._'))}</div>`;
      linkifyCards(box);
      renderIcons(box);
      btn.textContent = '🔑 Answer revealed';
      scroll();
    } catch (err) {
      btn.disabled = false;
      panel.querySelector('.solbox').innerHTML =
        '<span class="err">⚠️ Couldn\'t load the answer.</span>';
    }
  });
  scroll();
}

async function showWtp(arg, exclude) {
  arg = (arg || '').trim();
  addUser('/wtp' + (arg ? ' ' + arg : ''));
  const botEl = addBot();
  const bubble = botEl.querySelector('.bubble');
  try {
    const url = arg
      ? `/api/wtp/${encodeURIComponent(arg)}?session_id=${encodeURIComponent(sessionId)}`
      : `/api/wtp/next?session_id=${encodeURIComponent(sessionId)}`
        + (exclude ? '&exclude=' + encodeURIComponent(exclude) : '');
    const res = await fetch(url);
    const p = await res.json();
    if (!res.ok) {
      bubble.innerHTML = `<span class="err">⚠️ ${esc(p.detail || 'No such puzzle.')}</span>
        <br><small>Make one in the <a href="/editor">editor</a>.</small>`;
      return;
    }
    await renderWtp(bubble, p);
    history.replaceState(null, '', wtpUrl(p.id));
  } catch (e) {
    bubble.innerHTML = `<span class="err">⚠️ Network error.</span>`;
  } finally { scroll(); }
}

// Grow the textarea to fit its content (up to a cap); only show a scrollbar once
// it actually hits the cap, so normal typing never shows an awkward scrollbar.
function autosize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  input.style.overflowY = input.scrollHeight > 160 ? 'auto' : 'hidden';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; autosize();
  const card = text.match(/^\/card\s+(.+)/i);
  const search = text.match(/^\/(?:search|find)\s+(.+)/i);
  const colors = text.match(/^\/colou?rs?\b\s*(.*)$/i);
  const draft = text.match(/^\/(p1p1|p1p6)\b\s*(.*)$/i);
  const puzzle = text.match(/^\/(?:wtp|puzzle|play)\b\s*(.*)$/i);
  // Card lookups, searches, colour suggestions, draft packs and puzzles are all
  // standalone: they don't disturb an open follow-up thread, and they never go to
  // the model.
  if (card) lookupCard(card[1].trim());
  else if (search) searchCards(search[1].trim());
  else if (colors) showColors(colors[1]);
  else if (draft) showDraft(draft[1].toLowerCase(), draft[2]);
  else if (puzzle) showWtp(puzzle[1]);
  else ask(text, replyCtx || []);
});

// Enter sends, Shift+Enter newlines; textarea auto-grows.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', autosize);

document.getElementById('reset').addEventListener('click', () => {
  exitFollowup(); renderGreeting(); input.focus();
});
document.getElementById('followx').addEventListener('click', () => { exitFollowup(); input.focus(); });

// ---- card-name previews (hover/tap) + image lightbox modal ----
let CARD_RE = null;
const NAME_MAP = {};                         // lowercase name -> canonical name
const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const cardtip = document.getElementById('cardtip');
const tipImg = cardtip.querySelector('img');
const modal = document.getElementById('modal');
const modalImg = modal.querySelector('img');
let tipName = null;

const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// Cards whose names are also ordinary rules words (Battle, Fight, Recall …) —
// see cards.AMBIGUOUS_NAMES. Matched case-insensitively like everything else, but
// only *kept* by isCardMention() below.
const AMBIGUOUS = new Set();                 // lowercase names needing the extra test
const VETO_BEFORE = new Set(), VETO_AFTER = new Set();

// Fetch the card-name list once, then build a single boundary-anchored regex
// (longest names first so multi-word names win over any shorter name inside them).
fetch('/api/cardnames').then(r => r.json()).then(d => {
  const names = d.names || [];
  CARD_LIST = names;
  names.forEach(n => NAME_MAP[n.toLowerCase()] = n);
  (d.ambiguous || []).forEach(n => AMBIGUOUS.add(n.toLowerCase()));
  (d.veto_before || []).forEach(w => VETO_BEFORE.add(w));
  (d.veto_after || []).forEach(w => VETO_AFTER.add(w));
  const alt = [...names].sort((a, b) => b.length - a.length).map(escapeRe).join('|');
  if (alt) CARD_RE = new RegExp('(?<![\\w])(?:' + alt + ')(?![\\w])', 'gi');
  linkifyCards(wrap);                        // process anything already on screen
  pickSuggestions();                       // now we can suggest a real card
}).catch(() => {});

const wordBefore = s => (s.match(/([\w'-]+)[^\w]*$/) || [])[1] || '';
const wordAfter  = s => (s.match(/^[^\w]*([\w'-]+)/) || [])[1] || '';

// Is this match a real mention of the card, or just the English word? Ordinary
// names always pass. An ambiguous one (Battle, Fight, …) has to be written with
// the card's own capitalisation AND not sit next to a word that gives it away as
// rules-speak — "the Battle phase" and "during Battle" are the phase, not the card.
function isCardMention(matched, canonical, before, after) {
  if (!AMBIGUOUS.has(canonical.toLowerCase())) return true;
  if (matched !== canonical) return false;
  return !VETO_BEFORE.has(wordBefore(before).toLowerCase())
      && !VETO_AFTER.has(wordAfter(after).toLowerCase());
}

// ---- game icons in answers ----
// The server leaves [Augment] / {Battle} as tokens and we swap them for <img>
// here, on the DOM, *after* marked has run. Doing it in the markdown source
// instead would break the moment the model quotes card text inside a code span:
// a code span's contents are escaped, so the <img> would print as raw source.
// Walking text nodes reaches inside <code>, where an <img> renders fine.
let ICON_RE = null;
const ICON_URL = {};                         // lowercase token -> [/icons/x.webp, ...]

fetch('/api/icons').then(r => {
  if (!r.ok) throw new Error('GET /api/icons -> ' + r.status);
  return r.json();
}).then(d => {
  const toks = Object.keys(d.tokens || {});
  if (!toks.length) throw new Error('/api/icons returned no tokens');
  toks.forEach(t => ICON_URL[t.toLowerCase()] = d.tokens[t]);
  // Longest first so [Switch1] wins over [Switch].
  ICON_RE = new RegExp(
    toks.sort((a, b) => b.length - a.length).map(escapeRe).join('|'), 'gi');
  renderIcons(wrap);                         // catch anything already on screen
}).catch(e => {
  // Loud, because the symptom is quiet: with no token map, answers keep their
  // raw [Augment] / {Battle} tokens and simply look un-iconed. A 404 here almost
  // always means the server is running code older than this page — the page is
  // served no-store off disk, so new HTML happily talks to an old process.
  console.error('No game-icon map: answers will show raw [Augment] tokens. '
                + 'If this is a 404, restart the server.', e);
});

function renderIcons(root) {
  if (!ICON_RE) return;
  // No CODE/PRE in the skip set — unlike linkifyCards, reaching inside them is
  // the whole point. IMG/SCRIPT/STYLE hold no prose to substitute.
  const skip = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'IMG']);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.nodeValue) return NodeFilter.FILTER_REJECT;
      for (let p = n.parentNode; p && p !== root; p = p.parentNode)
        if (skip.has(p.nodeName)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; let n; while (n = walker.nextNode()) nodes.push(n);
  for (const t of nodes) {
    const text = t.nodeValue; ICON_RE.lastIndex = 0;
    if (!ICON_RE.test(text)) continue;
    ICON_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while (m = ICON_RE.exec(text)) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      // One token can be several icons: a cost like [4bb] is a "4" and two water drops.
      for (const url of ICON_URL[m[0].toLowerCase()]) {
        const img = document.createElement('img');
        img.className = 'icon';
        img.src = url;
        img.alt = m[0];
        frag.appendChild(img);
      }
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    t.parentNode.replaceChild(frag, t);
  }
}

// Wrap every card-name mention in `root` with a <span class="cardlink">. Walks
// text nodes only, skipping code/links/buttons and already-wrapped names.
function linkifyCards(root) {
  if (!CARD_RE) return;
  const skip = new Set(['A', 'CODE', 'PRE', 'SCRIPT', 'STYLE', 'BUTTON', 'TEXTAREA', 'IMG']);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (let p = n.parentNode; p && p !== root; p = p.parentNode) {
        if (skip.has(p.nodeName) || (p.classList && p.classList.contains('cardlink')))
          return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; let n; while (n = walker.nextNode()) nodes.push(n);
  for (const t of nodes) {
    const text = t.nodeValue; CARD_RE.lastIndex = 0;
    if (!CARD_RE.test(text)) continue;
    CARD_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m, linked = false;
    while (m = CARD_RE.exec(text)) {
      const canonical = NAME_MAP[m[0].toLowerCase()] || m[0];
      if (!isCardMention(m[0], canonical, text.slice(0, m.index),
                         text.slice(m.index + m[0].length))) continue;  // just the word
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'cardlink';
      span.dataset.card = canonical;
      span.textContent = m[0];
      frag.appendChild(span);
      last = m.index + m[0].length;
      linked = true;
    }
    if (!linked) continue;                    // every match was an ordinary word
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    t.parentNode.replaceChild(frag, t);
  }
}

function placeTip(link) {
  const r = link.getBoundingClientRect(), tw = cardtip.offsetWidth, th = cardtip.offsetHeight;
  let top = r.bottom + 8; if (top + th > innerHeight - 8) top = r.top - th - 8; if (top < 8) top = 8;
  const left = Math.min(Math.max(8, r.left), innerWidth - tw - 8);
  cardtip.style.left = left + 'px'; cardtip.style.top = top + 'px';
}
function showTip(link) {
  const name = link.dataset.card;
  if (tipName === name && !cardtip.classList.contains('hidden')) return;
  tipName = name;
  tipImg.src = '/art/' + encodeURIComponent(name); tipImg.alt = name;
  cardtip.classList.remove('hidden');
  placeTip(link);
  tipImg.onload = () => placeTip(link);       // re-place once real height is known
}
function hideTip() { cardtip.classList.add('hidden'); tipName = null; }

function openModal(src, alt) { modalImg.src = src; modalImg.alt = alt || ''; modal.classList.remove('hidden'); hideTip(); }
function closeModal() { modal.classList.add('hidden'); modalImg.src = ''; }

// Desktop: hover shows/hides the preview.
if (canHover) {
  document.addEventListener('mouseover', e => { const l = e.target.closest('.cardlink'); if (l) showTip(l); });
  document.addEventListener('mouseout', e => {
    const l = e.target.closest('.cardlink');
    if (l && !l.contains(e.relatedTarget) && !cardtip.contains(e.relatedTarget)) hideTip();
  });
}
// Clicks: image -> modal; tooltip image -> modal; card name (touch) -> toggle preview.
document.addEventListener('click', e => {
  const full = e.target.closest('img[data-full]');
  if (full) { openModal(full.dataset.full, full.alt); return; }
  if (e.target === tipImg) { openModal(tipImg.src, tipName); return; }
  const link = e.target.closest('.cardlink');
  if (link) {
    if (!canHover) {
      e.stopPropagation();
      (tipName === link.dataset.card && !cardtip.classList.contains('hidden')) ? hideTip() : showTip(link);
    }
    return;
  }
  if (!e.target.closest('#cardtip')) hideTip();
});
modal.addEventListener('click', e => { if (e.target === modal || e.target.classList.contains('close')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); hideTip(); } });
window.addEventListener('scroll', hideTip, true);   // hide preview while scrolling

// ---- greeting suggestions: picked once per page load (no live rotation) ----
// Describe-a-card examples for the /search chip. Written as a player actually
// half-remembers a card — an effect, not a name — since that's the whole point of
// the command. Each is checked against the real ranking in test_search.py.
const SEARCH_EXAMPLES = [
  'wood unit that draws a card when it dies',
  'counter a spell',
  '2/1 fire unit with haste',
  'unit with trample',
  'metal robot that makes more robots',
  'destroy all units with -1/-1 counters',
  'recall a unit from the bin to my hand',
  'unit that cant be blocked',
];
let curSearch = SEARCH_EXAMPLES[0];

function pickSuggestions() {
  const q = document.getElementById('exQ'), card = document.getElementById('exCard');
  const search = document.getElementById('exSearch');
  if (!q || !card) return;
  curQ = EXAMPLES.length ? rand(EXAMPLES) : 'Ask a rules question…';
  curCard = CARD_LIST.length ? rand(CARD_LIST) : 'Robot';
  curSearch = rand(SEARCH_EXAMPLES);
  q.textContent = 'Try: ' + curQ;
  card.textContent = '🔍  /card ' + curCard;
  if (search) search.textContent = '🔎  /search ' + curSearch;
}

function renderGreeting() {
  wrap.innerHTML = `<div class="msg bot"><div class="who">Rules Bot</div><div class="bubble">
    Ask me anything about Algomancy rules or cards — I answer from the official rules and card data, with sources.
    <div class="suggest">
      <button class="chip" id="exQ" type="button">Try: …</button>
      <button class="chip" id="exCard" type="button">🔍  /card …</button>
      <button class="chip" id="exSearch" type="button">🔎  /search … — find a card you can't name</button>
      <button class="chip" id="exColors" type="button">🎲  /colors — what should we play next?</button>
      <button class="chip" id="exDraft" type="button">🃏  /p1p6 — practice a turn-1 draft</button>
      <button class="chip" id="exWtp" type="button">🧩  /wtp — what's the play?</button>
    </div></div></div>`;
  pickSuggestions();
}

// Load saved past questions for the hint, then keep the suggestions rotating.
fetch('/api/examples').then(r => r.json()).then(d => {
  if (d.questions && d.questions.length) EXAMPLES = d.questions;
  pickSuggestions();
}).catch(() => {});

// Delegated (attached once): click a suggestion to run it. The suggestion is chosen
// once per page load (see pickSuggestions) and never changes on its own afterward.
wrap.addEventListener('click', e => {
  if (e.target.closest('#exQ')) { exitFollowup(); ask(curQ); }   // a suggestion is a fresh topic
  else if (e.target.closest('#exCard')) lookupCard(curCard);
  else if (e.target.closest('#exSearch')) searchCards(curSearch);
  else if (e.target.closest('#exColors')) showColors('');
  else if (e.target.closest('#exDraft')) showDraft('p1p6', '');
  else if (e.target.closest('#exWtp')) showWtp('');
});
renderGreeting();

// Deep links: /?draft=p1p6-7GK2QX loads that exact pack on open, /?wtp=wtp-7GK2QX
// that exact puzzle. A draft code carries its own mode, so resolve() reproduces it
// regardless of the mode hint here.
(() => {
  const params = new URLSearchParams(location.search);
  const code = params.get('draft');
  if (code) {
    const m = code.match(/^(p1p1|p1p6)-/i);
    showDraft(m ? m[1].toLowerCase() : 'p1p6', code);
  }
  const puzzle = params.get('wtp');
  if (puzzle) showWtp(puzzle);
})();

// ---- keep layout pinned to the visual viewport (mobile keyboard) ----
// Without this, focusing the input on mobile scrolls the whole page up. Sizing the
// body to the visual viewport keeps the header at the top and the input just above
// the keyboard, with only the message list scrolling between them.
const vv = window.visualViewport;
if (vv) {
  const fitViewport = () => {
    document.body.style.height = vv.height + 'px';
    document.body.style.top = vv.offsetTop + 'px';
  };
  vv.addEventListener('resize', fitViewport);
  vv.addEventListener('scroll', fitViewport);
  fitViewport();
}
</script>
</body>
</html>
