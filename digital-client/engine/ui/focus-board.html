<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algomancy — focus board (your layouts, live)</title>
<style>
:root{
  --bg:#0d1013; --line:#2e3742; --text:#d6dde6; --dim:#8794a3; --accent:#d9a441; --steel:#6f8bc0;
  --fire:#E2503B; --water:#3B82E2; --earth:#9C6B3F; --metal:#A8B0B8; --wood:#4FAF58;
  --felt:radial-gradient(ellipse 120% 85% at 50% 45%, #1b2129 0%, #12151a 58%, #0d1013 100%);
  --disp:'Bahnschrift','DIN Alternate','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.4 system-ui,sans-serif}
.switch{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;display:flex;gap:4px;
  background:rgba(13,16,19,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:4px}
.switch button{border:none;background:transparent;padding:5px 15px;border-radius:7px;font-family:var(--disp);
  letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--dim);cursor:pointer}
.switch button.on{background:var(--accent);color:#1a1206;font-weight:700}

#stage{position:fixed;inset:0;background:var(--felt)}
.zone{position:absolute;overflow:hidden;border-radius:12px;transition:left .5s cubic-bezier(.4,0,.2,1),
  top .5s cubic-bezier(.4,0,.2,1),width .5s cubic-bezier(.4,0,.2,1),height .5s cubic-bezier(.4,0,.2,1)}
.zone .zt{position:absolute;top:4px;left:9px;z-index:3;font-family:var(--disp);text-transform:uppercase;
  letter-spacing:.1em;font-size:10px;color:var(--dim);pointer-events:none}
.zone .zc{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:5px;align-content:center;justify-content:center;
  padding:20px 8px 8px;overflow:hidden}

/* zone chrome */
.z-opp{background:linear-gradient(180deg,rgba(120,150,200,.08),rgba(120,150,200,.01) 60%);
  box-shadow:inset 0 0 0 1px rgba(150,180,220,.09)}
.z-you{background:linear-gradient(0deg,rgba(217,164,65,.06),rgba(217,164,65,.01) 60%);
  box-shadow:inset 0 0 0 1px rgba(217,164,65,.08)}
.z-combat{background:linear-gradient(180deg,rgba(226,80,59,.09),rgba(217,164,65,.03) 75%);
  box-shadow:inset 0 0 0 1px rgba(226,80,59,.24),0 0 40px -16px rgba(226,80,59,.6)}
.z-plain{background:rgba(20,24,30,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.z-stack{background:radial-gradient(ellipse 92% 74% at 50% 42%,rgba(18,15,8,.55),rgba(13,16,19,.2) 74%,transparent);
  backdrop-filter:blur(2px);cursor:grab}
.z-stack:active{cursor:grabbing}
.z-bar{background:linear-gradient(0deg,rgba(20,24,30,.95),rgba(20,24,30,.6));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* cards */
.card{position:relative;width:var(--mini,60px);height:calc(var(--mini,60px)*1.4);border-radius:5px;overflow:hidden;
  flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.34)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .el{position:absolute;left:0;top:0;bottom:0;width:3px}
.card .plate{position:absolute;left:0;right:0;bottom:0;height:24%;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.card .pt{position:absolute;right:3px;bottom:2px;font:700 calc(var(--mini,60px)*.17)/1 var(--disp);
  color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.card .dmg{position:absolute;left:3px;bottom:2px;font:700 calc(var(--mini,60px)*.15)/1 var(--disp);color:#ffb3b3;text-shadow:0 1px 2px #000}
.card .atr{position:absolute;left:3px;top:3px;font:700 calc(var(--mini,60px)*.12)/1.3 var(--disp);letter-spacing:.03em;
  text-transform:uppercase;padding:1px 3px;border-radius:3px;background:rgba(13,16,19,.82);border:1px solid rgba(255,255,255,.14);color:#cdd6e0}
.card.back{background:repeating-linear-gradient(48deg,#243049 0 8px,#2b3a56 8px 16px)}
.card.sel{box-shadow:0 0 0 2px var(--water),0 0 14px -2px var(--water)}
.card.cand{box-shadow:0 0 0 2px var(--accent),0 0 18px -1px var(--accent)}
.card.tok{box-shadow:inset 0 0 0 2px rgba(217,164,65,.6),0 3px 8px rgba(0,0,0,.34)}
.card .xb{position:absolute;top:2px;right:2px;min-width:calc(var(--mini)*.28);height:calc(var(--mini)*.28);border-radius:50%;
  display:grid;place-items:center;font:700 calc(var(--mini)*.16)/1 var(--disp);background:radial-gradient(circle at 35% 30%,#f0d493,#c99a34);color:#1a1206}

.res{width:calc(var(--mini,60px)*.72);height:calc(var(--mini,60px)*.72*1.4);border-radius:5px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 2px 5px rgba(0,0,0,.4)}
.res img{width:100%;height:100%;object-fit:cover;display:block}
.res.exp{transform:rotate(90deg);filter:brightness(.62)}
.res.hid{filter:brightness(.72)}
.res.open{box-shadow:0 0 9px -3px var(--el,#888),0 2px 5px rgba(0,0,0,.4)}

.pile{display:flex}.pile .card{margin-left:calc(var(--mini,60px)*-.64)}.pile .card:first-child{margin-left:0}
.fan{display:flex;align-items:flex-end}.fan .card{margin-left:calc(var(--mini,60px)*-.34)}.fan .card:first-child{margin-left:0}

/* combat: engagements = attacker column facing blocker column */
.field{display:flex;align-items:center;justify-content:center;gap:calc(var(--mini)*.4);flex-wrap:wrap}
.eng{display:flex;align-items:center;gap:calc(var(--mini)*.18)}
.col{position:relative;display:flex;flex-direction:column;gap:3px;padding-left:5px}
.col::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:2px;border-radius:2px}
.col.atk::before{background:linear-gradient(#6fc36f,#3c7a3c)}
.col.blk::before{background:linear-gradient(#8fb0e0,#5f7fb0)}
.col .bnr{font:700 calc(var(--mini)*.13)/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#e8c07a;
  background:rgba(217,164,65,.16);border:1px solid rgba(217,164,65,.38);border-radius:3px;padding:1px 4px;white-space:nowrap;text-align:center}
.vs{font:800 calc(var(--mini)*.16)/1 var(--disp);color:#cf7156;letter-spacing:.1em}
.tolife{font:700 calc(var(--mini)*.4)/.7 var(--disp);color:#e06a6a;filter:drop-shadow(0 0 5px rgba(224,106,106,.5))}

.info{font-family:var(--disp);text-align:center;line-height:1.5}
.info .life{font-size:clamp(15px,2vw,26px);font-weight:700}
.stackt{position:absolute;top:5px;left:0;right:0;text-align:center;font-family:var(--disp);text-transform:uppercase;
  letter-spacing:.14em;font-size:10px;color:var(--accent);z-index:4;pointer-events:none}
.scol{display:flex;flex-direction:column;align-items:center;padding-top:14px}
.scol .card{margin-top:calc(var(--mini)*-.62)}.scol .card:first-child{margin-top:0}
.scol .card.top{box-shadow:0 8px 22px rgba(0,0,0,.7),0 0 0 2px var(--accent)}
.bar{display:flex;align-items:center;gap:14px;padding:0 16px;height:100%;font-family:var(--disp)}
.bar .dot{width:11px;height:11px;border-radius:50%;background:#6fc36f;box-shadow:0 0 12px #6fc36f}
.bar .pass{margin-left:auto;background:linear-gradient(180deg,#40632f,#33512a);border:1px solid #5b8747;
  color:#eaf3e2;border-radius:7px;padding:6px 16px;font-weight:600}
.bar .undo{background:#20262f;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 12px}
.phase{display:flex;align-items:center;gap:6px;height:100%;padding:0 14px;font-family:var(--disp)}
.phase .ph{text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--dim)}
.phase .ph.on{color:#1a1206;background:var(--accent);font-weight:700;padding:3px 9px;border-radius:6px}
.phase .sep{color:#3d4756}
.railc{padding:24px 10px 10px;font-size:12px;color:var(--dim);height:100%;overflow:hidden}
.railc b{color:var(--accent)}
.note{position:fixed;bottom:8px;left:10px;z-index:300;color:var(--dim);font-size:11px;
  background:rgba(13,16,19,.7);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
</style>
</head>
<body>
<div class="switch" id="sw"></div>
<div id="stage"></div>
<div class="note">Rendering your exported layouts live · drag the stack to move it · switch views above</div>

<script>
const A='../../../data/cards/';
const CARD=(n,o={})=>{const cls=['card',o.cls||''].join(' ');
  return `<div class="${cls}"><img src="${A}${n}.jpg" alt="">${o.el?`<span class="el" style="background:${o.el}"></span>`:''}`+
  `${o.atr?`<span class="atr">${o.atr}</span>`:''}${o.x?`<span class="xb">${o.x}</span>`:''}`+
  `<span class="plate"></span>${o.pt?`<span class="pt">${o.pt}</span>`:''}${o.dmg?`<span class="dmg">${o.dmg}</span>`:''}</div>`;};
const BACK=n=>Array.from({length:n},()=>'<div class="card back"></div>').join('');
const RES=(n,c='')=>`<div class="res ${c}" style="--el:var(${c.includes('open')?'--fire':'--metal'})"><img src="${A}${n}.jpg"></div>`;

// zone content + chrome class. combat/opp/you tinting keyed here.
const Z={
  phase:{chrome:'z-bar',html:v=>`<div class="phase">
     ${['Plan','Haste','Battle','Regroup','Deploy'].map(p=>`<span class="ph ${p.toLowerCase().startsWith(v.toLowerCase().slice(0,4))?'on':''}">${p}</span>`).join('<span class="sep">▸</span>')}
     <span style="flex:1"></span><span class="ph">Turn 4 · Round 1</span></div>`},
  oppInfo:{chrome:'z-opp',html:()=>`<div class="zc"><div class="info">Rho ⭐<div class="life" style="color:#e88">♥ 22</div></div></div>`},
  oppHand:{chrome:'z-opp',t:'Rho hand',html:()=>`<div class="zc"><div class="fan">${BACK(5)}</div></div>`},
  oppRes:{chrome:'z-opp',t:'Rho resources',html:()=>`<div class="zc">${RES('Fire-Resource','open')}${RES('Fire-Resource','open')}${RES('Water-Resource','open')}${RES('Dormant-Resource','hid')}${RES('Dormant-Resource','hid')}</div>`},
  oppBin:{chrome:'z-plain',t:'Rho bin',html:()=>`<div class="zc"><div class="pile">${CARD('Curio-Drifter')}${CARD('Dune-Drifter')}</div></div>`},
  oppRegion:{chrome:'z-opp',t:'Rho region',html:()=>`<div class="zc">${CARD('Rune-Channeler',{el:'var(--water)',pt:'2/3'})}${CARD('Aether-Channeler',{el:'var(--metal)',atr:'Reson',pt:'2/2'})}</div>`},
  combat:{chrome:'z-combat',t:'⚔ Combat — attacking Rho’s region',html:()=>`<div class="zc"><div class="field">
     <div class="eng">
       <div class="col atk"><div class="bnr">Flying·Piercing</div>${CARD('Ephemeral-Skywalker',{el:'var(--wood)',pt:'3/2'})}${CARD('Good-Whale',{el:'var(--water)',atr:'Fly',pt:'5/4'})}</div>
       <div class="vs">⚔</div>
       <div class="col blk">${CARD('Rune-Channeler',{el:'var(--water)',pt:'2/3',dmg:'−5'})}</div>
     </div>
     <div class="eng">
       <div class="col atk"><div class="bnr">Swift</div>${CARD('Ignis-Sprite',{el:'var(--fire)',atr:'Dead',pt:'1/1'})}</div>
       <div class="tolife" title="unblocked → their life">▼</div>
     </div></div></div>`},
  yourRegion:{chrome:'z-you',t:'Your region',html:()=>`<div class="zc">${CARD('Slag-Spewer',{el:'var(--earth)',pt:'3/4'})}${CARD('A-Fast-Pile-of-Rocks',{el:'var(--earth)',atr:'Haste',pt:'2/1'})}${CARD('Crystal',{el:'var(--metal)',cls:'tok',pt:'1/1'})}${CARD('Fireball',{el:'var(--fire)',cls:'tok',x:'X2'})}</div>`},
  yourHand:{chrome:'z-you',t:'Your hand',html:()=>`<div class="zc"><div class="fan">${CARD('Ignis-Sprite',{cls:'cand'})}${CARD('Fireball',{cls:'cand'})}${CARD('Dune-Drifter')}${CARD('Nebula-Drifter')}</div></div>`},
  yourRes:{chrome:'z-you',t:'Your resources',html:()=>`<div class="zc">${RES('Fire-Resource','open')}${RES('Fire-Resource','open')}${RES('Earth-Resource','exp')}${RES('Wood-Resource','open')}${RES('Dormant-Resource','hid')}${RES('Prismite')}</div>`},
  yourBin:{chrome:'z-plain',t:'Your bin',html:()=>`<div class="zc"><div class="pile">${CARD('Jelly')}${CARD('Ignis-Sprite')}${CARD('Fireball')}</div></div>`},
  stack:{chrome:'z-stack',html:()=>`<div class="stackt">◆ Stack</div><div class="zc"><div class="scol">
     <div class="card top" style="border-left:3px solid var(--steel)"><img src="${A}Jelly.jpg"><span class="plate"></span></div>
     <div class="card" style="border-left:3px solid var(--accent)"><img src="${A}Fireball.jpg"><span class="plate"></span></div>
     </div></div>`},
  actionBar:{chrome:'z-bar',html:v=>`<div class="bar"><span class="dot"></span>
     <span>${v==='Battle'?'You have priority':'Your turn — act freely'}</span>
     <span style="color:var(--dim)">${v==='Battle'?'both pass → resolve the stack':'Ctrl+Z to undo · opponent replays after you commit'}</span>
     ${v!=='Battle'?'<button class="undo">↶ Undo</button>':''}<button class="pass">${v==='Battle'?'Pass':'Done'}</button></div>`},
  rail:{chrome:'z-plain',t:'Log · preview',html:()=>`<div class="railc"><b>Game log</b><br>Rho declares blocks<br>You cast Fireball → Rune<br>Rho casts Jelly → Good Whale<br><br><b>hover a card…</b></div>`},
};

let LAYOUTS={};
const stage=document.getElementById('stage');
let cur='Battle', stackNudge={};

function draw(){
  stage.innerHTML='';
  const lay=LAYOUTS[cur]||{};
  for(const k of Object.keys(Z)){
    const r=lay[k]; if(!r) continue;
    const cfg=Z[k];
    const el=document.createElement('div');
    el.className='zone '+cfg.chrome; el.dataset.k=k;
    const nx=k==='stack'&&stackNudge[cur]?stackNudge[cur].x:r.x;
    const ny=k==='stack'&&stackNudge[cur]?stackNudge[cur].y:r.y;
    el.style.cssText=`left:${nx}%;top:${ny}%;width:${r.w}%;height:${r.h}%;--mini:${r.scale||42}px`;
    el.innerHTML=(cfg.t?`<div class="zt">${cfg.t}</div>`:'')+cfg.html(cur);
    stage.appendChild(el);
  }
  dragStack();
}
function dragStack(){
  const s=stage.querySelector('[data-k="stack"]'); if(!s)return;
  s.addEventListener('mousedown',e=>{
    if(e.button)return; e.preventDefault();
    const sr=stage.getBoundingClientRect(),r=s.getBoundingClientRect();
    const ox=e.clientX,oy=e.clientY,sx=parseFloat(s.style.left),sy=parseFloat(s.style.top);
    s.style.transition='none';
    function mv(ev){const nx=sx+(ev.clientX-ox)/sr.width*100,ny=sy+(ev.clientY-oy)/sr.height*100;
      s.style.left=Math.max(0,Math.min(96,nx))+'%';s.style.top=Math.max(6,Math.min(92,ny))+'%';}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
      stackNudge[cur]={x:parseFloat(s.style.left),y:parseFloat(s.style.top)};}
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}
function buildSwitch(){
  const sw=document.getElementById('sw');
  sw.innerHTML=Object.keys(LAYOUTS).map(v=>`<button class="${v===cur?'on':''}" data-v="${v}">${v}</button>`).join('');
  sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.v;buildSwitch();draw();});
}
// card hover → rail preview
stage.addEventListener('mouseover',e=>{
  const c=e.target.closest('.card img'); const rail=stage.querySelector('[data-k="rail"] .railc');
  if(c&&rail){const src=c.getAttribute('src');rail.innerHTML=`<img src="${src}" style="width:100%;border-radius:8px">`;}
});

// inlined from layouts.json so this opens reliably as a file:// URL
LAYOUTS={
 "Planning":{phase:{x:0,y:0,w:100,h:5,scale:26},oppInfo:{x:0,y:5,w:13,h:12,scale:26},oppRes:{x:14,y:5,w:19,h:12,scale:24},oppHand:{x:34,y:5,w:34,h:12,scale:32},oppBin:{x:69,y:5,w:15,h:12,scale:30},oppRegion:{x:0,y:17,w:84,h:15,scale:36},yourHand:{x:0,y:34,w:84,h:24,scale:40},stack:{x:62,y:33,w:18,h:25,scale:42},yourRegion:{x:0,y:57,w:84,h:14,scale:40},yourRes:{x:0,y:60,w:84,h:26,scale:46},yourBin:{x:70,y:72,w:14,h:19,scale:34},actionBar:{x:0,y:92,w:84,h:8,scale:26},rail:{x:85,y:5,w:15,h:94,scale:30}},
 "Battle":{phase:{x:0,y:0,w:100,h:5,scale:26},oppInfo:{x:0,y:5,w:9,h:8,scale:26},oppRes:{x:9,y:5,w:26,h:8,scale:45},oppHand:{x:35,y:5,w:34,h:8,scale:32},oppBin:{x:69,y:5,w:15,h:8,scale:30},combat:{x:0,y:13,w:69,h:44,scale:120},oppRegion:{x:69,y:13,w:15,h:44,scale:112},actionBar:{x:0,y:57,w:84,h:8,scale:26},yourRegion:{x:0,y:65,w:69,h:14,scale:40},yourBin:{x:70,y:66,w:13,h:31,scale:34},stack:{x:1,y:28,w:18,h:25,scale:99},yourRes:{x:0,y:79,w:24,h:19,scale:78},yourHand:{x:24,y:79,w:45,h:19,scale:95},rail:{x:85,y:5,w:15,h:94,scale:30}},
 "Deploy":{phase:{x:0,y:0,w:100,h:5,scale:26},oppInfo:{x:0,y:5,w:13,h:12,scale:26},oppRes:{x:13,y:5,w:15,h:12,scale:24},oppHand:{x:28,y:5,w:15,h:12,scale:32},oppBin:{x:43,y:5,w:15,h:12,scale:30},oppRegion:{x:58,y:5,w:26,h:12,scale:40},actionBar:{x:0,y:17,w:84,h:7,scale:26},yourRegion:{x:0,y:24,w:69,h:43,scale:120},yourBin:{x:69,y:24,w:15,h:43,scale:111},stack:{x:76,y:49,w:18,h:25,scale:98},yourRes:{x:0,y:67,w:34,h:26,scale:91},yourHand:{x:34,y:67,w:50,h:26,scale:117},rail:{x:85,y:5,w:15,h:94,scale:30}}
};
buildSwitch(); draw();
</script>
</body>
</html>
